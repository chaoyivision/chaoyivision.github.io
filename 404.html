<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to chaoyiz.com</title>
    <link rel="dns-prefetch" href="//chaoyiz.com">
    <link rel="preconnect" href="https://chaoyiz.com">
    <script>
      window.location.replace(
        "https://chaoyiz.com" +
          window.location.pathname +
          window.location.search +
          window.location.hash
      );
    </script>
    <meta http-equiv="refresh" content="0; url=https://chaoyiz.com/">
  </head>
  <body>
    <p>
      This website has moved to
      <a href="https://chaoyiz.com/">chaoyiz.com</a>.
    </p>
  </body>
</html>
